<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeachHouse — Visualizador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e8f4f2;
      --bg-deep: #cce8e4;
      --panel: rgba(255, 252, 247, 0.94);
      --panel-solid: #fffaf4;
      --border: rgba(13, 148, 136, 0.18);
      --border-strong: rgba(13, 148, 136, 0.35);
      --text: #1e3d42;
      --muted: #5f7c82;
      --accent: #0d9488;
      --accent-hover: #0f766e;
      --coral: #e07a5f;
      --coral-soft: rgba(224, 122, 95, 0.15);
      --sand: #f4e4c8;
      --sand-dark: #d4b896;
      --ocean: #0891b2;
      --palm: #2d6a4f;
      --sun: #f4a261;
      --shadow: 0 8px 32px rgba(30, 61, 66, 0.08);
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Outfit", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse 120% 80% at 100% 0%, rgba(135, 206, 235, 0.45) 0%, transparent 55%),
        radial-gradient(ellipse 90% 60% at 0% 100%, rgba(244, 228, 200, 0.7) 0%, transparent 50%),
        linear-gradient(165deg, var(--bg) 0%, var(--sand) 45%, var(--bg-deep) 100%);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: 1fr;
    }
    aside {
      background: var(--panel);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    aside::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--palm), var(--accent), var(--ocean), var(--sun), var(--coral));
      z-index: 1;
    }
    header {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
      background:
        linear-gradient(135deg, rgba(13, 148, 136, 0.06) 0%, transparent 60%),
        linear-gradient(180deg, rgba(255, 250, 244, 0.9) 0%, transparent 100%);
    }
    header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(145deg, var(--accent) 0%, var(--ocean) 100%);
      display: grid;
      place-items: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(13, 148, 136, 0.35);
      flex-shrink: 0;
    }
    header h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text);
      line-height: 1.1;
    }
    header p {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 6px;
      padding-left: 46px;
    }
    .controls {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 12px;
    }
    .mode-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 4px;
      background: var(--sand);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .mode-toggle button,
    .row button,
    .toolbar button,
    .parts-list-header button {
      background: var(--panel-solid);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.82rem;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .mode-toggle button:hover,
    .row button:hover,
    .toolbar button:hover,
    .parts-list-header button:hover {
      border-color: var(--border-strong);
      background: #fff;
    }
    .mode-toggle button:active,
    .row button:active {
      transform: scale(0.98);
    }
    .mode-toggle button.active,
    .toolbar button.active {
      background: linear-gradient(135deg, var(--accent) 0%, var(--ocean) 100%);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.35);
    }
    label {
      font-size: 0.72rem;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .row button {
      flex: 1;
    }
    #btn-play {
      background: linear-gradient(135deg, var(--coral) 0%, #d4694f 100%);
      border-color: transparent;
      color: #fff;
    }
    #btn-play:hover {
      background: linear-gradient(135deg, #e88970 0%, var(--coral) 100%);
      color: #fff;
    }
    .phase-name {
      font-size: 0.88rem;
      min-height: 1.2em;
      color: var(--accent-hover);
      font-weight: 500;
    }
    .audio-label {
      font-size: 0.75rem;
      color: var(--muted);
      min-height: 1.1em;
    }
    .stats {
      font-size: 0.75rem;
      color: var(--muted);
      padding: 0 16px 8px;
      line-height: 1.45;
    }
    .section-label {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 16px 6px;
      font-weight: 600;
    }
    .category-list {
      max-height: 220px;
      overflow: auto;
      padding: 0 8px 8px;
      border-bottom: 1px solid var(--border);
    }
    .category-list::-webkit-scrollbar,
    .parts-list::-webkit-scrollbar {
      width: 6px;
    }
    .category-list::-webkit-scrollbar-thumb,
    .parts-list::-webkit-scrollbar-thumb {
      background: var(--sand-dark);
      border-radius: 3px;
    }
    .category-item {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.78rem;
      margin-bottom: 3px;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .category-item:hover {
      background: var(--sand);
      border-color: var(--border);
    }
    .category-item.active {
      background: rgba(13, 148, 136, 0.1);
      border-color: var(--accent);
      outline: none;
    }
    .category-count {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      background: var(--sand);
      padding: 2px 6px;
      border-radius: 999px;
    }
    .parts-list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 4px;
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .parts-list {
      flex: 1;
      overflow: auto;
      padding: 8px;
    }
    .part-item {
      display: grid;
      grid-template-columns: 12px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.78rem;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .part-item:hover {
      background: var(--sand);
      border-color: var(--border);
    }
    .part-item.selected {
      background: rgba(13, 148, 136, 0.12);
      border-color: var(--accent);
      outline: none;
    }
    .part-item.hidden-part { opacity: 0.35; }
    .part-item.dimmed { opacity: 0.45; }
    .part-item.category-match {
      border-color: rgba(13, 148, 136, 0.4);
      background: rgba(13, 148, 136, 0.06);
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }
    .part-id {
      font-family: ui-monospace, monospace;
      font-weight: 600;
      color: var(--text);
    }
    .part-meta { color: var(--muted); font-size: 0.7rem; }
    #viewport {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    #canvas-host {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    #canvas-host canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .toolbar button {
      background: rgba(255, 252, 247, 0.92);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      border-color: var(--border);
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(165deg, rgba(232, 244, 242, 0.92) 0%, rgba(244, 228, 200, 0.88) 100%);
      z-index: 20;
      font-weight: 500;
      color: var(--accent-hover);
      letter-spacing: 0.02em;
    }
    .loading::before {
      content: "";
      width: 44px;
      height: 44px;
      border: 3px solid var(--sand-dark);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .selection-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 252, 247, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--coral);
      border-radius: var(--radius);
      padding: 14px 18px;
      z-index: 10;
      min-width: 240px;
      box-shadow: var(--shadow);
    }
    .selection-panel[hidden] { display: none; }
    .selection-panel .selection-kicker {
      font-size: 0.68rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .selection-panel .selection-id {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-hover);
      margin-bottom: 6px;
    }
    .selection-panel .selection-meta {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <aside>
    <header>
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">🌴</div>
        <h1>BeachHouse</h1>
      </div>
      <p>Casa de madera · visualizador y animación</p>
    </header>
    <div class="controls">
      <div class="mode-toggle">
        <button id="btn-model" class="active">Modelado</button>
        <button id="btn-animate">Animación</button>
      </div>
      <div id="animation-controls" hidden>
        <label>Fase de construcción</label>
        <input id="phase-slider" type="range" min="0" max="8" value="0" step="1" />
        <div class="phase-name" id="phase-label">Cimentación</div>
        <div class="row">
          <button id="btn-play">▶ Reproducir</button>
          <button id="btn-reset">↺ Reiniciar</button>
        </div>
        <div class="audio-label" id="audio-label">♪ wasteland · Calamity Mod</div>
      </div>
      <div id="model-controls">
        <p class="section-label">Categorías</p>
        <div class="category-list" id="category-list"></div>
      </div>
      <p class="stats">Selecciona una pieza o filtra por categoría para revisar el catálogo.</p>
    </div>
    <div class="stats" id="stats"></div>
    <div class="parts-list-header">
      <span id="parts-list-title">Piezas</span>
      <button id="btn-clear-category" hidden>Limpiar filtro</button>
    </div>
    <div class="parts-list" id="parts-list"></div>
  </aside>
  <div id="viewport">
    <div id="canvas-host"></div>
    <div class="toolbar">
      <button id="btn-fit">Encuadrar</button>
    </div>
    <div id="selection-panel" class="selection-panel" hidden>
      <div class="selection-kicker">Seleccionado</div>
      <div class="selection-id" id="selection-id"></div>
      <div class="selection-meta" id="selection-meta"></div>
    </div>
    <div class="loading" id="loading">Cargando modelo…</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { OBJLoader } from "three/addons/loaders/OBJLoader.js";
    import { MTLLoader } from "three/addons/loaders/MTLLoader.js";

    const HIGHLIGHT_COLOR = 0x0d9488;
    const HIGHLIGHT_EMISSIVE = 0x0f766e;
    const DEFAULT_PHASE_DURATION_MS = 3000;

    const animationAudio = (() => {
      const TRACK_URL = "assets/audio/wasteland.mp3";
      const TARGET_VOLUME = 0.72;
      const FADE_IN_S = 1.4;
      const FADE_OUT_S = 1.0;

      let audio = null;
      let active = false;
      let fadeRaf = null;
      let trackReady = false;

      function init() {
        if (audio) return;
        audio = new Audio(TRACK_URL);
        audio.loop = true;
        audio.preload = "auto";
        audio.volume = 0;
        audio.addEventListener("canplaythrough", () => {
          trackReady = true;
          updateAudioLabel();
        }, { once: true });
        audio.addEventListener("error", () => {
          trackReady = false;
          updateAudioLabel(true);
        });
        updateAudioLabel();
      }

      function updateAudioLabel(errored = false) {
        const el = document.getElementById("audio-label");
        if (!el) return;
        if (errored) {
          el.textContent = "Audio no disponible";
          return;
        }
        el.textContent = trackReady
          ? "♪ wasteland · Calamity Mod"
          : "Cargando audio…";
      }

      function clampVolume(value) {
        return Math.min(1, Math.max(0, value));
      }

      function fadeVolume(to, seconds, onDone) {
        if (!audio) return;
        if (fadeRaf) cancelAnimationFrame(fadeRaf);
        const from = clampVolume(audio.volume);
        const target = clampVolume(to);
        const start = performance.now();
        const duration = Math.max(0.05, seconds) * 1000;
        const step = (now) => {
          const t = Math.min(1, (now - start) / duration);
          audio.volume = clampVolume(from + (target - from) * t);
          if (t < 1) {
            fadeRaf = requestAnimationFrame(step);
            return;
          }
          audio.volume = target;
          fadeRaf = null;
          onDone?.();
        };
        fadeRaf = requestAnimationFrame(step);
      }

      async function start() {
        init();
        if (!audio) return;
        if (active && !audio.paused && audio.volume > 0.01) return;
        active = true;
        try {
          await audio.play();
        } catch (err) {
          console.warn("No se pudo iniciar el audio:", err);
        }
        fadeVolume(TARGET_VOLUME, FADE_IN_S);
      }

      function stop() {
        if (!active || !audio) return;
        active = false;
        fadeVolume(0, FADE_OUT_S, () => {
          audio.volume = 0;
          audio.pause();
          audio.currentTime = 0;
        });
      }

      function isActive() {
        return active;
      }

      return { init, start, stop, isActive };
    })();

    const state = {
      mode: "model",
      catalog: null,
      partsByObjRef: new Map(),
      partsByGroup: new Map(),
      meshesByObjRef: new Map(),
      animMeshesByObjRef: new Map(),
      selectedObjRef: null,
      selectedCategory: null,
      categoryCounts: new Map(),
      maxPhase: 0,
      hasPhases: false,
      playing: false,
      playTimer: null,
      phasePartsMap: new Map(),
      phaseDefs: new Map(),
      materialsPhaseId: null,
      anim: {
        phase: 0,
        step: 0,
        falling: null,
        playing: false,
        pauseUntil: 0,
        previewAllInPhase: false,
        materialsTransition: null,
        materialsComplete: false,
      },
      modelCamera: null,
      animCamera: {
        pivot: new THREE.Vector3(),
        radius: 158,
        zOffset: 6,
        pivotPartId: "PIL-013",
        pivotZOffset: -5,
        angle: 0,
        speed: 0.28,
      },
      animFallHeight: 120,
    };

    const els = {
      btnModel: document.getElementById("btn-model"),
      btnAnimate: document.getElementById("btn-animate"),
      animationControls: document.getElementById("animation-controls"),
      phaseSlider: document.getElementById("phase-slider"),
      phaseLabel: document.getElementById("phase-label"),
      btnPlay: document.getElementById("btn-play"),
      btnReset: document.getElementById("btn-reset"),
      modelControls: document.getElementById("model-controls"),
      categoryList: document.getElementById("category-list"),
      btnClearCategory: document.getElementById("btn-clear-category"),
      partsListTitle: document.getElementById("parts-list-title"),
      stats: document.getElementById("stats"),
      partsList: document.getElementById("parts-list"),
      loading: document.getElementById("loading"),
      btnFit: document.getElementById("btn-fit"),
      canvasHost: document.getElementById("canvas-host"),
      selectionPanel: document.getElementById("selection-panel"),
      selectionId: document.getElementById("selection-id"),
      selectionMeta: document.getElementById("selection-meta"),
    };

    const scene = new THREE.Scene();
    const constructionBg = new THREE.Color(0xd4ebe8);
    scene.background = constructionBg.clone();
    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 2000);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    els.canvasHost.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    function makeProceduralSandTexture() {
      const size = 512;
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ddd0b0";
      ctx.fillRect(0, 0, size, size);
      const img = ctx.getImageData(0, 0, size, size);
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const i = (y * size + x) * 4;
          const grain = (Math.random() - 0.5) * 22;
          const streak = Math.sin(x * 0.04 + y * 0.02) * 6;
          img.data[i] = Math.min(255, Math.max(0, 198 + grain + streak));
          img.data[i + 1] = Math.min(255, Math.max(0, 186 + grain * 0.9 + streak));
          img.data[i + 2] = Math.min(255, Math.max(0, 158 + grain * 0.7 + streak * 0.5));
        }
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(14, 14);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeWaterGradientTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");
      const grad = ctx.createLinearGradient(0, 0, 512, 0);
      grad.addColorStop(0, "#0c4a6e");
      grad.addColorStop(0.35, "#0e7490");
      grad.addColorStop(0.7, "#0891b2");
      grad.addColorStop(1, "#67c4d6");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 64);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.repeat.set(2.5, 1);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createAtmosphericSky() {
      const geometry = new THREE.SphereGeometry(750, 48, 24);
      const material = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        fog: false,
        transparent: true,
        depthWrite: false,
        uniforms: {
          sunDirection: { value: new THREE.Vector3(0.55, -0.35, 0.42).normalize() },
          sunColor: { value: new THREE.Color(0xffe8c8) },
          zenithColor: { value: new THREE.Color(0x5a7a9e) },
          horizonColor: { value: new THREE.Color(0xf0c080) },
          nadirColor: { value: new THREE.Color(0xe8b878) },
          opacity: { value: 0 },
        },
        vertexShader: `
          varying vec3 vDir;
          void main() {
            vDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 sunDirection;
          uniform vec3 sunColor;
          uniform vec3 zenithColor;
          uniform vec3 horizonColor;
          uniform vec3 nadirColor;
          uniform float opacity;
          varying vec3 vDir;
          void main() {
            vec3 dir = normalize(vDir);
            float elevation = dir.z;
            float aboveHorizon = smoothstep(-0.02, 0.18, elevation);
            float midSky = smoothstep(0.05, 0.55, elevation);
            float zenith = smoothstep(0.35, 0.9, elevation);
            vec3 sky = mix(nadirColor, horizonColor, aboveHorizon);
            sky = mix(sky, mix(horizonColor, zenithColor, 0.55), midSky);
            sky = mix(sky, zenithColor, zenith);
            float sunAlign = max(dot(dir, normalize(sunDirection)), 0.0);
            float disc = pow(sunAlign, 1100.0) * 1.1;
            float corona = pow(sunAlign, 72.0) * 0.045;
            float glow = pow(sunAlign, 10.0) * 0.018;
            sky += sunColor * (disc + corona + glow);
            float haze = exp(-abs(elevation) * 9.0) * 0.1;
            sky = mix(sky, horizonColor, haze);
            gl_FragColor = vec4(sky, opacity);
          }
        `,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.frustumCulled = false;
      mesh.renderOrder = -2;
      return { mesh, material };
    }

    const beachSkyFallback = new THREE.Color(0xe8c898);

    function resize() {
      const w = els.canvasHost.clientWidth;
      const h = els.canvasHost.clientHeight;
      if (!w || !h) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h, false);
    }
    window.addEventListener("resize", resize);
    new ResizeObserver(resize).observe(els.canvasHost);
    requestAnimationFrame(resize);

    function catalogBounds() {
      const box = new THREE.Box3();
      if (!state.catalog?.parts?.length) return box;
      for (const part of state.catalog.parts) {
        if (part.bounds) {
          box.expandByPoint(new THREE.Vector3(...part.bounds.min));
          box.expandByPoint(new THREE.Vector3(...part.bounds.max));
          continue;
        }
        const [cx, cy, cz] = part.center;
        const [sx, sy, sz] = part.size;
        box.expandByPoint(new THREE.Vector3(cx - sx / 2, cy - sy / 2, cz - sz / 2));
        box.expandByPoint(new THREE.Vector3(cx + sx / 2, cy + sy / 2, cz + sz / 2));
      }
      return box;
    }

    function fitCamera() {
      let box = new THREE.Box3().setFromObject(modelGroup);
      if (box.isEmpty()) box = catalogBounds();
      if (box.isEmpty()) return;

      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const dist = maxDim * 1.6;

      camera.up.set(0, 0, 1);
      camera.position.set(
        center.x + dist * 0.72,
        center.y - dist * 0.62,
        center.z + dist * 0.42
      );
      controls.target.copy(center);
      controls.update();
      grid.position.set(center.x, center.y, 0);
      saveModelCamera();
    }

    function saveModelCamera() {
      state.modelCamera = {
        position: camera.position.clone(),
        target: controls.target.clone(),
      };
    }

    function restoreModelCamera() {
      if (!state.modelCamera) return;
      camera.position.copy(state.modelCamera.position);
      controls.target.copy(state.modelCamera.target);
      controls.update();
    }

    function computeAnimCameraPivot() {
      let pivotX;
      let pivotY;
      const pivotPart = state.catalog?.parts?.find(
        (part) => part.id === state.animCamera.pivotPartId
      );
      if (pivotPart?.center) {
        pivotX = pivotPart.center[0];
        pivotY = pivotPart.center[1];
      } else {
        let box = new THREE.Box3().setFromObject(modelGroup);
        if (box.isEmpty()) box = catalogBounds();
        const center = box.getCenter(new THREE.Vector3());
        pivotX = center.x;
        pivotY = center.y;
      }

      let pillarHeight = 73;
      for (const part of state.catalog?.parts || []) {
        if (part.category === "pillar" && part.size?.[2]) {
          pillarHeight = Math.max(pillarHeight, part.size[2]);
        }
      }

      return new THREE.Vector3(
        pivotX,
        pivotY,
        pillarHeight / 2 + state.animCamera.pivotZOffset
      );
    }

    function phaseDurationMs(phaseId) {
      const def = phaseDef(phaseId);
      return def?.phase_duration_ms ?? DEFAULT_PHASE_DURATION_MS;
    }

    function phaseElementDuration(phaseId) {
      const parts = state.phasePartsMap.get(phaseId) || [];
      if (!parts.length) return DEFAULT_PHASE_DURATION_MS;
      return phaseDurationMs(phaseId) / parts.length;
    }

    function initAnimCamera() {
      state.animCamera.pivot.copy(computeAnimCameraPivot());
      state.animCamera.angle = 0;
      applyAnimCameraPosition();
    }

    function applyAnimCameraPosition() {
      const { pivot, radius, zOffset, angle } = state.animCamera;
      camera.up.set(0, 0, 1);
      camera.position.set(
        pivot.x + radius * Math.cos(angle),
        pivot.y + radius * Math.sin(angle),
        pivot.z + zOffset
      );
      camera.lookAt(pivot);
    }

    function tickAnimCamera(delta) {
      if (state.mode !== "animate") return;
      state.animCamera.angle += state.animCamera.speed * delta;
      applyAnimCameraPosition();
    }

    function partLabel(part) {
      return part.id || part.obj_ref;
    }

    function categoryDef(key) {
      return state.catalog.categories?.find((cat) => cat.key === key);
    }

    function categoryColor(key) {
      if (key === "__none__") {
        return state.catalog.category_colors?.__none__ || "#64748b";
      }
      return state.catalog.category_colors?.[key] || categoryDef(key)?.color || "#8b9cb3";
    }

    function partMatchesCategory(part) {
      if (!state.selectedCategory) return true;
      if (state.selectedCategory === "__none__") return !part.category;
      return part.category === state.selectedCategory;
    }

    function buildCategoryCounts() {
      state.categoryCounts.clear();
      for (const part of state.catalog.parts) {
        const key = part.category || "__none__";
        state.categoryCounts.set(key, (state.categoryCounts.get(key) || 0) + 1);
      }
    }

    function renderCategoryList() {
      els.categoryList.innerHTML = "";
      const categories = state.catalog.categories || [];
      for (const cat of categories) {
        const count = state.categoryCounts.get(cat.key) || 0;
        const item = document.createElement("div");
        item.className = "category-item" +
          (state.selectedCategory === cat.key ? " active" : "");
        item.innerHTML = `
          <span class="swatch" style="background:${cat.color}"></span>
          <span>${cat.label}</span>
          <span class="category-count">${count}</span>`;
        item.onclick = () => selectCategory(cat.key);
        els.categoryList.appendChild(item);
      }
    }

    function selectCategory(key) {
      state.selectedCategory = state.selectedCategory === key ? null : key;
      state.selectedObjRef = null;
      updateVisibility();
    }

    function clearCategoryFilter() {
      state.selectedCategory = null;
      updateVisibility();
    }

    function partColor(part) {
      if (part.category && state.catalog.category_colors?.[part.category]) {
        return state.catalog.category_colors[part.category];
      }
      if (part.material && state.catalog.material_colors?.[part.material]) {
        return state.catalog.material_colors[part.material];
      }
      return "#8b9cb3";
    }

    function woodFinishColor(part) {
      const key = part.category || "__none__";
      const finish = state.catalog.wood_finishes?.[key];
      if (finish?.color) return finish.color;
      return categoryColor(key);
    }

    function constructionColor(part) {
      return categoryColor(part.category || "__none__");
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function materialsBlendLinear() {
      const tr = state.anim.materialsTransition;
      if (tr) return tr.progress ?? 0;
      if (state.anim.materialsComplete) return 1;
      return 0;
    }

    function materialsBlend() {
      return easeInOutCubic(materialsBlendLinear());
    }

    function usesWoodMaterials() {
      return materialsBlend() > 0;
    }

    function layoutBeachScene() {
      const pivot = computeAnimCameraPivot();
      beachEnv.position.set(pivot.x, pivot.y, 0);
      sunTarget.position.set(pivot.x, pivot.y, 6);
      sunLight.position.set(pivot.x + 130, pivot.y - 85, 62);
      skyFill.position.set(pivot.x - 85, pivot.y + 75, 48);

      const sunDir = new THREE.Vector3()
        .subVectors(sunLight.position, sunTarget.position)
        .normalize();
      atmosphericSky.material.uniforms.sunDirection.value.copy(sunDir);
    }

    function updateBeachEnvironment() {
      if (materialsBlend() <= 0) {
        atmosphericSky.mesh.visible = false;
        return;
      }
      atmosphericSky.mesh.visible = true;
      atmosphericSky.mesh.position.copy(camera.position);
    }

    function applySceneLighting(blend) {
      constructionLights.visible = blend < 1;
      beachLights.visible = blend > 0;
      ambient.intensity = 0.78 * (1 - blend);
      dir.intensity = 0.88 * (1 - blend);
      fill.intensity = 0.42 * (1 - blend);
      hemiLight.intensity = 0.32 * blend;
      sunLight.intensity = 1.05 * blend;
      skyFill.intensity = 0.18 * blend;
      renderer.toneMappingExposure = THREE.MathUtils.lerp(1.0, 0.92, blend);
    }

    function setAnimMeshShadows(enabled) {
      for (const entry of state.animMeshesByObjRef.values()) {
        entry.mesh.traverse((child) => {
          if (!child.isMesh) return;
          child.castShadow = enabled;
          child.receiveShadow = enabled;
        });
      }
    }

    function syncBeachScene() {
      const blend = state.mode === "animate" ? materialsBlend() : 0;
      const beach = blend > 0;

      beachEnv.visible = beach;
      atmosphericSky.mesh.visible = beach;
      beachLights.visible = beach;
      constructionLights.visible = blend < 1;

      sandMat.transparent = blend < 1;
      sandMat.opacity = blend;
      oceanMat.opacity = 0.94 * blend;
      atmosphericSky.material.uniforms.opacity.value = blend;

      setAnimMeshShadows(blend >= 0.55);
      applySceneLighting(blend);

      if (beach) layoutBeachScene();

      if (blend <= 0) {
        scene.background = constructionBg;
        scene.fog = null;
        return;
      }

      scene.background = constructionBg.clone().lerp(beachSkyFallback, blend);
      if (blend >= 1) {
        scene.background = beachSkyFallback;
        scene.fog = beachFog;
        beachFog.density = 0.0028;
        return;
      }

      scene.fog = beachFog;
      beachFog.density = 0.0028 * blend;
    }

    function applyAnimMeshStyle(entry, part) {
      if (!entry?.mesh) return;
      const blend = materialsBlend();
      const from = new THREE.Color(constructionColor(part));
      const to = new THREE.Color(woodFinishColor(part));
      const color = from.lerp(to, blend);
      const emissiveIntensity = THREE.MathUtils.lerp(0.12, 0.015, blend);
      entry.mesh.traverse((child) => {
        if (!child.isMesh) return;
        const mat = child.material.clone();
        mat.side = THREE.DoubleSide;
        mat.color = color;
        mat.emissive = color.clone();
        mat.emissiveIntensity = emissiveIntensity;
        if (blend >= 1 && mat.isMeshPhongMaterial) {
          mat.shininess = 12;
        }
        mat.transparent = false;
        mat.opacity = 1;
        child.material = mat;
      });
    }

    function refreshAnimMaterials() {
      for (const part of state.catalog.parts) {
        const entry = state.animMeshesByObjRef.get(part.obj_ref);
        if (!entry?.mesh.visible) continue;
        applyAnimMeshStyle(entry, part);
      }
    }

    function prepareMaterialsPhase() {
      state.anim.previewAllInPhase = true;
      for (const part of state.catalog.parts) {
        if (part.phase == null) continue;
        landAnimMesh(part.obj_ref);
      }
    }

    function beginMaterialsTransition() {
      prepareMaterialsPhase();
      const duration = phaseDurationMs(state.anim.phase);
      state.anim.materialsTransition = {
        duration,
        elapsed: 0,
        progress: 0,
        lastTick: null,
      };
      state.anim.pauseUntil = Number.POSITIVE_INFINITY;
      updatePhaseLabel();
      syncBeachScene();
      refreshAnimMaterials();
      refreshUI({ animOnly: true });
    }

    function finishMaterialsTransition() {
      state.anim.materialsTransition = null;
      state.anim.materialsComplete = true;
      syncBeachScene();
      refreshAnimMaterials();
      updatePhaseLabel();
      if (state.anim.playing) stopPlay({ keepAudio: true });
    }

    function enterMaterialsPhase(instant = true) {
      prepareMaterialsPhase();
      state.anim.materialsTransition = null;
      state.anim.materialsComplete = instant;
      if (instant) {
        syncBeachScene();
        refreshAnimMaterials();
      }
      updatePhaseLabel();
      refreshUI({ animOnly: true });
    }

    function tickMaterialsTransition(now) {
      const tr = state.anim.materialsTransition;
      if (state.mode !== "animate" || !tr) return;

      if (state.anim.playing) {
        if (tr.lastTick == null) tr.lastTick = now;
        tr.elapsed = Math.min(tr.duration, tr.elapsed + (now - tr.lastTick));
        tr.lastTick = now;
        tr.progress = tr.elapsed / tr.duration;
      } else {
        tr.lastTick = null;
      }

      syncBeachScene();
      refreshAnimMaterials();
      updatePhaseLabel();

      if (tr.progress >= 1) finishMaterialsTransition();
    }

    function removeOutline(mesh) {
      const outline = mesh.userData.outline;
      if (!outline) return;
      mesh.remove(outline);
      outline.geometry.dispose();
      outline.material.dispose();
      delete mesh.userData.outline;
    }

    function applyModelMeshStyle(mesh, part, visible) {
      mesh.visible = visible;
      const isSelected = state.selectedObjRef === part.obj_ref;
      const categoryActive = state.selectedCategory != null;
      const inCategory = categoryActive && partMatchesCategory(part);

      removeOutline(mesh);

      mesh.traverse((child) => {
        if (!child.isMesh) return;
        if (!child.userData.baseMaterial) {
          child.userData.baseMaterial = child.material;
        }

        const mat = child.userData.baseMaterial.clone();
        mat.side = THREE.DoubleSide;

        if (!visible) {
          mat.transparent = true;
          mat.opacity = 0.15;
        } else if (part.temporary) {
          mat.side = THREE.DoubleSide;
          mat.transparent = true;
          mat.opacity =
            part.notes?.startsWith("demo:plane") ||
            part.notes?.startsWith("demo:roof-plane") ||
            part.notes?.startsWith("demo:stairs-guide") ||
            part.notes?.startsWith("demo:roof-subtract")
              ? 0.45
              : 0.85;
          if (part.notes?.startsWith("demo:plane") || part.notes?.startsWith("demo:roof-plane")) {
            mat.color = new THREE.Color("#38bdf8");
            mat.emissive = new THREE.Color("#0ea5e9");
            mat.emissiveIntensity = isSelected ? 0.5 : 0.25;
          } else if (part.notes?.startsWith("demo:stairs-guide")) {
            mat.color = new THREE.Color("#c084fc");
            mat.emissive = new THREE.Color("#a855f7");
            mat.emissiveIntensity = isSelected ? 0.5 : 0.28;
          } else if (part.notes?.startsWith("demo:roof-subtract")) {
            mat.color = new THREE.Color("#f97316");
            mat.emissive = new THREE.Color("#ea580c");
            mat.emissiveIntensity = isSelected ? 0.5 : 0.28;
          } else if (part.notes?.startsWith("demo:boolean")) {
            mat.color = new THREE.Color("#46b749");
            mat.emissive = new THREE.Color("#2d8a30");
            mat.emissiveIntensity = isSelected ? 0.45 : 0.2;
          } else if (part.notes?.startsWith("demo:extend")) {
            mat.color = new THREE.Color("#a855f7");
            mat.emissive = new THREE.Color("#7c3aed");
            mat.emissiveIntensity = isSelected ? 0.45 : 0.2;
          } else {
            mat.color = new THREE.Color("#f59e0b");
            mat.emissive = new THREE.Color("#d97706");
            mat.emissiveIntensity = isSelected ? 0.45 : 0.2;
          }
        } else if (categoryActive) {
          if (inCategory) {
            const colorKey = part.category || "__none__";
            const color = new THREE.Color(categoryColor(colorKey));
            mat.color = color;
            mat.emissive = color.clone();
            mat.emissiveIntensity = isSelected ? 0.65 : 0.42;
            mat.opacity = 1;
          } else {
            mat.transparent = true;
            mat.opacity = 0.1;
          }
        } else if (isSelected) {
          mat.emissive = new THREE.Color(HIGHLIGHT_EMISSIVE);
          mat.emissiveIntensity = 0.55;
          mat.opacity = 1;
        } else {
          mat.opacity = 1;
        }

        mat.transparent = mat.opacity < 1;
        child.material = mat;
      });

      if (visible && mesh.geometry && (inCategory || isSelected)) {
        const outlineColor = inCategory
          ? new THREE.Color(categoryColor(part.category || "__none__")).getHex()
          : HIGHLIGHT_COLOR;
        const outline = new THREE.LineSegments(
          new THREE.EdgesGeometry(mesh.geometry),
          new THREE.LineBasicMaterial({ color: outlineColor, transparent: true, opacity: 1 })
        );
        mesh.add(outline);
        mesh.userData.outline = outline;
      }
    }

    function buildAnimEnvironment() {
      animGroup.clear();
      state.animMeshesByObjRef.clear();
      const def = phaseDef(0) || {};
      const fallHeight = def.fall_height || state.animFallHeight;
      state.animFallHeight = fallHeight;

      for (const [objRef, modelMesh] of state.meshesByObjRef) {
        const animMesh = modelMesh.clone();
        animMesh.material = modelMesh.material.clone();
        animMesh.material.side = THREE.DoubleSide;
        const home = modelMesh.userData.homePosition.clone();
        const sky = home.clone();
        sky.z += fallHeight;
        animMesh.position.copy(sky);
        animMesh.visible = false;
        animMesh.userData.objRef = objRef;
        animGroup.add(animMesh);
        state.animMeshesByObjRef.set(objRef, { mesh: animMesh, home, sky });
      }
    }

    function hideAllAnimMeshes() {
      for (const entry of state.animMeshesByObjRef.values()) {
        entry.mesh.position.copy(entry.sky);
        entry.mesh.visible = false;
      }
    }

    function landAnimMesh(objRef) {
      const entry = state.animMeshesByObjRef.get(objRef);
      if (!entry) return;
      entry.mesh.position.copy(entry.home);
      entry.mesh.visible = true;
      const part = state.partsByObjRef.get(objRef);
      if (part) applyAnimMeshStyle(entry, part);
    }

    function teleportAnimMeshToSky(objRef) {
      const entry = state.animMeshesByObjRef.get(objRef);
      if (!entry) return;
      entry.mesh.position.copy(entry.sky);
      entry.mesh.visible = true;
      const part = state.partsByObjRef.get(objRef);
      if (part) applyAnimMeshStyle(entry, part);
    }

    function syncAnimPreview() {
      for (const part of state.catalog.parts) {
        const entry = state.animMeshesByObjRef.get(part.obj_ref);
        if (!entry) continue;
        const st = animationPartState(part);
        if (st === "landed") {
          entry.mesh.position.copy(entry.home);
          entry.mesh.visible = true;
        } else if (st === "falling") {
          entry.mesh.visible = true;
        } else {
          entry.mesh.position.copy(entry.sky);
          entry.mesh.visible = false;
        }
      }
      refreshAnimMaterials();
      syncBeachScene();
    }

    function countAnimVisible() {
      let n = 0;
      for (const entry of state.animMeshesByObjRef.values()) {
        if (entry.mesh.visible) n += 1;
      }
      return n;
    }

    function buildPhaseMap() {
      state.phasePartsMap.clear();
      state.phaseDefs.clear();
      for (const def of state.catalog.phases || []) {
        state.phaseDefs.set(def.id, def);
      }
      for (const part of state.catalog.parts) {
        if (part.phase == null) continue;
        if (!state.phasePartsMap.has(part.phase)) {
          state.phasePartsMap.set(part.phase, []);
        }
        state.phasePartsMap.get(part.phase).push(part);
      }
      for (const list of state.phasePartsMap.values()) {
        list.sort((a, b) => {
          const keyA = a.id || a.obj_ref;
          const keyB = b.id || b.obj_ref;
          return keyA.localeCompare(keyB, undefined, { numeric: true });
        });
      }
      state.hasPhases = state.phasePartsMap.size > 0;
      state.maxPhase = state.hasPhases
        ? Math.max(...state.phasePartsMap.keys(), ...(state.catalog.phases || []).map((p) => p.id))
        : 0;
      state.materialsPhaseId = (state.catalog.phases || []).find((p) => p.animation === "materials")?.id ?? null;
    }

    function phaseDef(phaseId) {
      return state.phaseDefs.get(phaseId);
    }

    function animationPartState(part) {
      if (part.phase == null) return "hidden";
      if (state.materialsPhaseId != null && state.anim.phase >= state.materialsPhaseId) {
        return "landed";
      }
      if (part.phase < state.anim.phase) return "landed";
      if (part.phase > state.anim.phase) return "hidden";

      const parts = state.phasePartsMap.get(part.phase) || [];
      const idx = parts.findIndex((p) => p.obj_ref === part.obj_ref);
      if (idx < 0) return "hidden";
      if (state.anim.falling?.objRef === part.obj_ref) return "falling";
      if (state.anim.previewAllInPhase) return "landed";
      if (idx < state.anim.step) return "landed";
      return "hidden";
    }

    function resetAnimation() {
      stopPlay({ keepAudio: false });
      state.anim.phase = 0;
      state.anim.step = 0;
      state.anim.falling = null;
      state.anim.pauseUntil = 0;
      state.anim.previewAllInPhase = false;
      state.anim.materialsTransition = null;
      state.anim.materialsComplete = false;
      els.phaseSlider.value = "0";
      hideAllAnimMeshes();
      syncBeachScene();
      updatePhaseLabel();
      refreshUI();
    }

    function startNextFall() {
      if (!state.anim.playing) return;

      const def = phaseDef(state.anim.phase) || {};
      if (def.animation === "materials") {
        if (state.anim.materialsTransition) return;
        if (state.anim.materialsComplete) {
          stopPlay({ keepAudio: true });
          return;
        }
        beginMaterialsTransition();
        return;
      }

      const parts = state.phasePartsMap.get(state.anim.phase) || [];
      if (state.anim.step >= parts.length) {
        if (state.anim.phase >= state.maxPhase) {
          stopPlay();
          return;
        }
        state.anim.phase += 1;
        state.anim.step = 0;
        els.phaseSlider.value = String(state.anim.phase);
        startNextFall();
        return;
      }

      const part = parts[state.anim.step];
      const entry = state.animMeshesByObjRef.get(part.obj_ref);
      if (!entry) {
        state.anim.step += 1;
        startNextFall();
        return;
      }

      const animType = def.animation || "instant";

      if (animType === "fall") {
        const duration = phaseElementDuration(state.anim.phase);
        teleportAnimMeshToSky(part.obj_ref);
        state.anim.falling = {
          objRef: part.obj_ref,
          startTime: performance.now(),
          duration,
          fromZ: entry.sky.z,
          toZ: entry.home.z,
        };
      } else {
        landAnimMesh(part.obj_ref);
        state.anim.step += 1;
        state.anim.pauseUntil = performance.now();
      }

      updatePhaseLabel();
      refreshUI({ animOnly: true });
    }

    function tickAnimation(now) {
      if (state.mode !== "animate" || !state.anim.playing) return;
      if (state.anim.materialsTransition) return;

      if (state.anim.falling) {
        const f = state.anim.falling;
        const entry = state.animMeshesByObjRef.get(f.objRef);
        const t = Math.min(1, (now - f.startTime) / f.duration);
        const eased = 1 - Math.pow(1 - t, 3);
        if (entry) entry.mesh.position.z = f.fromZ + (f.toZ - f.fromZ) * eased;
        if (t >= 1) {
          if (entry) entry.mesh.position.z = f.toZ;
          state.anim.falling = null;
          state.anim.step += 1;
          state.anim.pauseUntil = now;
          updatePhaseLabel();
          refreshUI({ animOnly: true });
        }
        return;
      }

      if (now >= state.anim.pauseUntil) {
        startNextFall();
      }
    }

    function phaseVisible(part) {
      if (state.mode === "model") {
        return part.visible !== false;
      }
      const animState = animationPartState(part);
      return animState === "landed" || animState === "falling";
    }

    function updateModelVisibility() {
      for (const [objRef, part] of state.partsByObjRef) {
        const mesh = state.meshesByObjRef.get(objRef);
        if (!mesh) continue;
        const visible = part.visible !== false;
        applyModelMeshStyle(mesh, part, visible);
      }
    }

    function refreshUI(options = {}) {
      if (state.mode === "animate") {
        if (!options.animOnly) syncAnimPreview();
        syncBeachScene();
        updateStats();
        if (!options.animOnly) renderPartsList();
        updateSelectionPanel();
        return;
      }
      renderCategoryList();
      updateModelVisibility();
      renderPartsList();
      updateStats();
      updateSelectionPanel();
      els.btnClearCategory.hidden = !state.selectedCategory;
      if (state.selectedCategory) {
        const cat = categoryDef(state.selectedCategory);
        const count = state.categoryCounts.get(state.selectedCategory) || 0;
        els.partsListTitle.textContent = cat ? `${cat.label} (${count})` : "Piezas";
      } else {
        els.partsListTitle.textContent = "Piezas";
      }
    }

    function updateVisibility() {
      refreshUI();
    }

    function updateSelectionPanel() {
      if (state.mode === "animate") {
        els.selectionPanel.hidden = true;
        return;
      }

      if (state.selectedObjRef) {
        const part = state.partsByObjRef.get(state.selectedObjRef);
        if (!part) {
          els.selectionPanel.hidden = true;
          return;
        }
        els.selectionPanel.hidden = false;
        els.selectionId.textContent = partLabel(part);
        const [sx, sy, sz] = part.size;
        els.selectionMeta.textContent = [
          part.obj_ref,
          part.group || "",
          part.category ? `categoría: ${part.category}` : "sin categoría",
          part.phase != null ? `fase ${part.phase}` : "sin fase",
          `tamaño ${sx}×${sy}×${sz}`,
        ].filter(Boolean).join(" · ");
        return;
      }

      if (state.selectedCategory) {
        const cat = categoryDef(state.selectedCategory);
        const count = state.categoryCounts.get(state.selectedCategory) || 0;
        els.selectionPanel.hidden = false;
        els.selectionId.textContent = cat?.label || state.selectedCategory;
        els.selectionMeta.textContent = `${count} piezas en esta categoría · revisa que estén bien clasificadas`;
        return;
      }

      els.selectionPanel.hidden = true;
    }

    function updateStats() {
      const total = state.catalog.parts.length;
      const shown = [...state.partsByObjRef.values()].filter(phaseVisible).length;
      els.stats.textContent = state.mode === "model"
        ? state.selectedCategory
          ? `${state.categoryCounts.get(state.selectedCategory) || 0} piezas resaltadas · filtro activo`
          : `${shown}/${total} piezas · ${state.meshesByObjRef.size} mallas · modo modelado`
        : state.hasPhases
          ? state.anim.playing
            ? `${phaseDef(state.anim.phase)?.label || "Fase " + state.anim.phase} · construyendo…`
            : `Vista fase ${state.anim.phase}/${state.maxPhase} · ${countAnimVisible()} piezas visibles`
          : "Sin fases asignadas en el catálogo";
    }

    function renderPartsList() {
      const query = state.mode === "animate" ? state.anim.phase : null;
      els.partsList.innerHTML = "";
      const sorted = [...state.catalog.parts].sort((a, b) =>
        a.obj_ref.localeCompare(b.obj_ref, undefined, { numeric: true })
      );
      for (const part of sorted) {
        if (state.selectedCategory && !partMatchesCategory(part)) continue;
        const visible = phaseVisible(part);
        const inCategory = state.selectedCategory && partMatchesCategory(part);
        const meta = [
          part.obj_ref,
          part.category ? part.category : "sin categoría",
          part.phase != null ? `fase ${part.phase}` : "sin fase",
        ].join(" · ");
        const item = document.createElement("div");
        item.className = "part-item" +
          (part.obj_ref === state.selectedObjRef ? " selected" : "") +
          (inCategory ? " category-match" : "") +
          (!visible ? " hidden-part" : "") +
          (state.selectedCategory && !inCategory ? " dimmed" : "");
        const swatchColor = state.mode === "animate" && usesWoodMaterials()
          ? woodFinishColor(part)
          : partColor(part);
        item.innerHTML = `
          <span class="swatch" style="background:${swatchColor}"></span>
          <span>
            <div class="part-id">${partLabel(part)}</div>
            <div class="part-meta">${meta}</div>
          </span>
          <span class="part-meta">${part.material || ""}</span>`;
        item.onclick = () => selectPart(part.obj_ref);
        if (query !== null && part.phase === query) {
          item.scrollIntoView({ block: "nearest" });
        }
        els.partsList.appendChild(item);
      }
    }

    function clearSelection() {
      state.selectedObjRef = null;
      updateVisibility();
    }

    function selectPart(objRef) {
      state.selectedObjRef = objRef;
      updateVisibility();
      const part = state.partsByObjRef.get(objRef);
      if (part) {
        const mesh = state.meshesByObjRef.get(objRef);
        if (mesh) {
          const c = new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());
          controls.target.copy(c);
        }
        const item = els.partsList.querySelector(".part-item.selected");
        item?.scrollIntoView({ block: "nearest" });
      }
    }

    function setMode(mode) {
      state.mode = mode;
      els.btnModel.classList.toggle("active", mode === "model");
      els.btnAnimate.classList.toggle("active", mode === "animate");
      els.animationControls.hidden = mode !== "animate";
      els.modelControls.hidden = mode !== "model";
      els.btnFit.hidden = mode === "animate";

      if (mode === "animate") {
        saveModelCamera();
        controls.enabled = false;
        modelEnv.visible = false;
        animEnv.visible = true;
        state.selectedCategory = null;
        state.selectedObjRef = null;
        initAnimCamera();
        resetAnimation();
      } else {
        stopPlay();
        controls.enabled = true;
        modelEnv.visible = true;
        animEnv.visible = false;
        animationAudio.stop();
        restoreModelCamera();
      }
      refreshUI();
    }

    function updatePhaseLabel() {
      const phase = state.mode === "animate" ? state.anim.phase : Number(els.phaseSlider.value);
      if (!state.hasPhases) {
        els.phaseLabel.textContent = "Asigna phase en catalog/parts.json";
        return;
      }
      const def = phaseDef(phase);
      const label = def?.label || state.catalog.phase_labels?.[String(phase)] || `Fase ${phase}`;
      if (phase === state.materialsPhaseId) {
        const total = state.catalog.parts.filter((p) => p.phase != null).length;
        if (state.anim.materialsTransition) {
          const pct = Math.round(materialsBlend() * 100);
          els.phaseLabel.textContent = `${label} · ${pct}% · materiales y playa`;
          return;
        }
        els.phaseLabel.textContent = `${label} · ${total} piezas · materiales reales`;
        return;
      }
      const parts = state.phasePartsMap.get(phase) || [];
      if (state.mode === "animate" && state.anim.playing && parts.length) {
        const current = Math.min(
          state.anim.step + (state.anim.falling ? 1 : 0),
          parts.length
        );
        els.phaseLabel.textContent = `${label} · ${current}/${parts.length}`;
        return;
      }
      els.phaseLabel.textContent = parts.length ? `${label} (${parts.length})` : label;
    }

    async function loadAll() {
      const catalogResp = await fetch("catalog/parts.json");
      state.catalog = await catalogResp.json();

      buildCategoryCounts();
      buildPhaseMap();
      els.phaseSlider.max = String(state.maxPhase);
      els.phaseSlider.disabled = !state.hasPhases;
      els.btnPlay.disabled = !state.hasPhases;
      animationAudio.init();

      for (const part of state.catalog.parts) {
        state.partsByObjRef.set(part.obj_ref, part);
        if (part.group) {
          state.partsByGroup.set(part.group, part);
        }
      }

      const mtl = await new Promise((resolve, reject) => {
        new MTLLoader().load("obj.mtl", resolve, undefined, reject);
      });
      mtl.preload();

      const obj = await new Promise((resolve, reject) => {
        new OBJLoader()
          .setMaterials(mtl)
          .load("tinker.obj", resolve, undefined, reject);
      });

      modelGroup.add(obj);

      obj.traverse((child) => {
        if (!child.isMesh) return;

        // Three.js OBJLoader names meshes after `g` lines, not `o` lines.
        const part = state.partsByGroup.get(child.name);
        if (!part) return;

        const objRef = part.obj_ref;
        child.userData.objRef = objRef;
        child.userData.homePosition = child.position.clone();
        child.material.side = THREE.DoubleSide;
        state.meshesByObjRef.set(objRef, child);
      });

      if (state.meshesByObjRef.size === 0) {
        throw new Error("No se encontraron mallas — revisa tinker.obj y catalog/parts.json");
      }

      buildAnimEnvironment();
      layoutBeachScene();
      buildCategoryCounts();
      els.loading.style.display = "none";
      resize();
      fitCamera();
      if (!state.modelCamera) saveModelCamera();
      updatePhaseLabel();
      renderCategoryList();
      updateVisibility();
    }

    function stopPlay(options = {}) {
      const onMaterialsPhase = state.materialsPhaseId != null
        && state.anim.phase >= state.materialsPhaseId;
      const keepAudio = options.keepAudio ?? onMaterialsPhase;

      state.anim.playing = false;
      state.playing = false;
      els.btnPlay.textContent = "▶ Reproducir";
      if (!keepAudio) animationAudio.stop();
    }

    function startPlay() {
      if (!state.hasPhases) return;
      if (state.anim.playing) {
        stopPlay();
        return;
      }
      state.anim.playing = true;
      state.playing = true;
      state.anim.previewAllInPhase = false;
      els.btnPlay.textContent = "⏸ Pausar";
      animationAudio.start();
      if (state.anim.step === 0 && !state.anim.falling && state.anim.phase === 0) {
        hideAllAnimMeshes();
      }
      state.anim.pauseUntil = performance.now();
      if (!state.anim.falling) startNextFall();
    }

    els.btnModel.onclick = () => { stopPlay(); setMode("model"); };
    els.btnAnimate.onclick = () => { setMode("animate"); };
    els.phaseSlider.oninput = () => {
      if (state.anim.playing) return;
      const phase = Number(els.phaseSlider.value);
      state.anim.phase = phase;
      state.anim.step = 0;
      state.anim.falling = null;
      state.anim.previewAllInPhase = true;
      state.anim.materialsTransition = null;
      state.anim.materialsComplete = false;
      hideAllAnimMeshes();
      if (state.materialsPhaseId != null && phase >= state.materialsPhaseId) {
        enterMaterialsPhase(true);
      } else {
        syncAnimPreview();
      }
      if (
        state.materialsPhaseId != null
        && phase >= state.materialsPhaseId
        && !animationAudio.isActive()
      ) {
        animationAudio.start();
      }
      updatePhaseLabel();
      refreshUI({ animOnly: true });
    };
    els.btnPlay.onclick = startPlay;
    els.btnReset.onclick = resetAnimation;
    els.btnClearCategory.onclick = clearCategoryFilter;
    els.btnFit.onclick = () => {
      if (state.mode === "model") fitCamera();
    };

    let lastFrameTime = performance.now();
    function animateFrame(now) {
      requestAnimationFrame(animateFrame);
      const delta = Math.min(0.05, (now - lastFrameTime) / 1000);
      lastFrameTime = now;
      tickAnimCamera(delta);
      tickAnimation(now);
      tickMaterialsTransition(now);
      updateBeachEnvironment();
      if (state.mode === "model") controls.update();
      renderer.render(scene, camera);
    }
    animateFrame();
    loadAll().catch((err) => {
      els.loading.textContent = `Error: ${err.message}. Abrí index.html con Live Server (no file://).`;
      console.error(err);
    });

    renderer.domElement.addEventListener("pointerdown", (event) => {
      if (state.mode === "animate") return;
      pointerDown = { x: event.clientX, y: event.clientY };
    });

    renderer.domElement.addEventListener("pointerup", (event) => {
      if (state.mode === "animate") return;
      if (!pointerDown) return;
      const dx = event.clientX - pointerDown.x;
      const dy = event.clientY - pointerDown.y;
      pointerDown = null;
      if (Math.hypot(dx, dy) > 6) return;

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const meshes = [...state.meshesByObjRef.values()].filter((mesh) => mesh.visible);
      const hits = raycaster.intersectObjects(meshes, false);
      if (hits.length) {
        const objRef = hits[0].object.userData.objRef;
        if (objRef) selectPart(objRef);
      } else {
        clearSelection();
      }
    });
  </script>
</body>
</html>
